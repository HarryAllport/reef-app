<!DOCTYPE html>
<!--

  The root of this site used to serve an old build. Anyone who found the
  repository, or kept an old bookmark, landed on a version from before the
  app was even called Reef Key. This sends them to the current one instead.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="0; url=./beta/">
<link rel="canonical" href="https://harryallport.github.io/reef-app/beta/">
<title>Reef Key</title>
<style>
  :root{ --ink:#060b10; --deep:#0d151c; --line:#1d2b36; --foam:#e6f0f4; --muted:#7d94a2; --titrant:#2fe0c6; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--ink)}
  body{display:flex;align-items:center;justify-content:center;color:var(--foam);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:24px}
  .box{text-align:center;max-width:420px}
  svg{width:74px;height:74px;margin-bottom:18px}
  h1{font-size:13px;font-weight:800;letter-spacing:.42em;text-indent:.42em;margin:0 0 10px;color:var(--foam)}
  h1 span{color:var(--titrant)}
  p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0 0 18px}
  a{display:inline-block;background:#14837a;color:#fff;text-decoration:none;
    padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px}
  a.ghost{background:none;color:var(--muted);padding:10px 0;display:block;margin-top:8px;font-weight:400;font-size:12.5px}
</style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="#2fe0c6" stroke-width="9" stroke-linecap="round">
        <circle cx="100" cy="62" r="30"/>
        <path d="M100 92V150"/>
        <path d="M100 116h20M100 133h15"/>
      </g>
      <path d="M4 152c24 0 24-13 48-13s24 13 48 13 24-13 48-13 24 13 48 13" fill="none"
            stroke="#2fe0c6" stroke-width="5" stroke-linecap="round" opacity=".85"/>
      <path d="M4 172c24 0 24-11 48-11s24 11 48 11 24-11 48-11 24 11 48 11" fill="none"
            stroke="#2fe0c6" stroke-width="4" stroke-linecap="round" opacity=".4"/>
    </svg>
    <h1>REEF <span>KEY</span></h1>
    <p>Taking you to the app. If nothing happens, use the button.</p>
    <a href="./beta/">Open Reef Key</a>
    <a class="ghost" href="./beta/lite/">Or open Reef Key Lite</a>
  </div>
</body>
</html>
